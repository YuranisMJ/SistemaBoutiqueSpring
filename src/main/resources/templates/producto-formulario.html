<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo producto - SistemaBoutique</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F2EBD9;
      margin: 0;
    }

    header {
      background-color: #4A1521;
      color: white;
      padding: 20px;
    }

    .contenedor {
      width: 80%;
      max-width: 700px;
      margin: 30px auto;
      background-color: white;
      padding: 25px;
      border-radius: 8px;
    }

    h2 {
      color: #4A1521;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    .boton-guardar {
      margin-top: 20px;
      background-color: #4A1521;
      color: white;
      border: none;
      padding: 12px 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>SistemaBoutique</h1>
</header>

<div class="contenedor">

  <h2>Registrar producto</h2>

  
   <!-- Formulario para registrar un producto en el inventario -->
<form action="/productos/guardar" method="post" th:object="${producto}">
    <input type="hidden" th:field="*{idProducto}">

  <label for="nombre">Nombre</label>
  <input id="nombre" type="text" th:field="*{nombre}" required>

  <label for="descripcion">Descripción</label>
  <input id="descripcion" type="text" th:field="*{descripcion}">

  <label for="talla">Talla</label>
  <input id="talla" type="text" th:field="*{talla}" required>

  <label for="color">Color</label>
  <input id="color" type="text" th:field="*{color}" required>

  <label for="precio">Precio</label>
  <input
    id="precio"
    type="number"
    th:field="*{precio}"
    step="0.01"
    min="0.01"
    required>

  <label for="stock">Stock</label>
  <input
    id="stock"
    type="number"
    th:field="*{stock}"
    min="0"
    required>

  <label for="stockMinimo">Stock mínimo</label>
  <input
    id="stockMinimo"
    type="number"
    th:field="*{stockMinimo}"
    min="0"
    required>

  <label for="idCategoria">ID categoría</label>
  <input
    id="idCategoria"
    type="number"
    th:field="*{idCategoria}"
    min="1"
    required>

  <button type="submit" class="boton-guardar">
    Guardar producto
  </button>

</form>

</div>

</body>
</html>
